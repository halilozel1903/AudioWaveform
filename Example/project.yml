name: AudioWaveformDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  AudioWaveform:
    path: ..
targets:
  WavesWatch:
    # A standalone (watch-only) app: one application target built with the watchOS SDK, no iOS companion.
    # Shared/DemoAudio/*.caf (generated by scripts/generate-demo-audio.py) is copied into the bundle as resources.
    type: application
    platform: watchOS
    sources:
      - Shared
      - Watch
    dependencies:
      - package: AudioWaveform
        product: AudioWaveform
      - package: AudioWaveform
        product: AudioWaveformUI
    info:
      path: WavesWatch-Info.plist
      properties:
        CFBundleDisplayName: Waves
        WKApplication: true
        WKWatchOnly: true
        NSMicrophoneUsageDescription: Waves shows live microphone levels as a waveform. Nothing is recorded or stored.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.WavesWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Waves
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Waves shows live microphone levels as a waveform. Nothing is recorded or stored.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
  WavesPhone:
    type: application
    platform: iOS
    sources:
      - Shared
      - Phone
    dependencies:
      - package: AudioWaveform
        product: AudioWaveform
      - package: AudioWaveform
        product: AudioWaveformUI
    info:
      path: WavesPhone-Info.plist
      properties:
        CFBundleDisplayName: Waves
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Waves shows live microphone levels as a waveform. Nothing is recorded or stored.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.WavesPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Waves
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Waves shows live microphone levels as a waveform. Nothing is recorded or stored.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  WavesWatch:
    build:
      targets:
        WavesWatch: all
    run:
      config: Debug
  WavesPhone:
    build:
      targets:
        WavesPhone: all
    run:
      config: Debug
